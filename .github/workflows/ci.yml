name: CI

on:
  push:
    branches: [ci]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake ninja-build gcc-16 g++-16 make pkg-config bison flex             ragel file python3 libssl-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -B build -G "Ninja Multi-Config"             -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16             -DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,norelro

      - name: Build CLI (Debug)
        run: cmake --build build --config Debug

      - name: Test built CLI
        run: |
          export PATH="$PWD/build/src/Debug:$PATH"
          command -v ogrep
          bash ./scripts/test_cli.sh

      - name: Upload CLI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnipp-cli
          path: |
            build/src/Debug/omnipp
            build/src/Debug/ogrep
            build/src/Debug/ocat
          if-no-files-found: warn
